name: Secure copilot CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  # Lets a build be started without pushing something to provoke one, which is
  # what you want when the last merge predates a token or a credential change
  # rather than a code change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm run test

  # Mobile ships only when someone builds it: merging updates the website and
  # never the phone, which is how a copilot-less app stayed on a device for
  # weeks. This starts the build on main so the artifact is always current;
  # submitting it to TestFlight stays a person's decision.
  mobile-build:
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: mobile
    runs-on: ubuntu-latest
    # Job level rather than on the step. A step's own env block is not reliably
    # readable from that same step's `if`, so gating on it there can leave the
    # build skipping for ever even once the secret exists, which fails silently
    # and looks exactly like everything working.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Both steps skip rather than fail without a token, so a fork or a repo
      # with no EAS account still gets a green build.
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - name: Start the iOS build
        if: env.EXPO_TOKEN != ''
        run: eas build --platform ios --profile production --non-interactive --no-wait

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests evals
      - run: pytest --cov=app --cov-branch --cov-report=term --cov-report=xml
      - run: python evals/run_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: gdp-planner-api:ci
