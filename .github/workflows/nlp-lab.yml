name: Northwest NLP Lab

on:
  push:
    paths: ['nlp-lab/**', 'backend/app/models.py', '.github/workflows/nlp-lab.yml']
  pull_request:
    paths: ['nlp-lab/**', 'backend/app/models.py', '.github/workflows/nlp-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nlp-lab/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt -e '.[dev]'
      - run: python -m nlplab.cli setup-nltk
      - run: python -m pytest -o addopts=''
  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nlp-lab/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
  browser:
    needs: [pipeline, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nlp-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nlp-lab/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nltk>=3.9.2,<4'
      - run: python -m nlplab.cli setup-nltk
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev
      - run: npm run build:runtime
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        with:
          name: nlp-pages
          path: nlp-lab/dist
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nlp-browser-failure
          path: nlp-lab/test-results
