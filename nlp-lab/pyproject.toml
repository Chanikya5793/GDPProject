[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northwest-nlp-lab"
version = "0.1.0"
description = "An inspectable, local classical NLP companion for Northwest Planner"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "nltk>=3.9.2,<4", "scikit-learn>=1.6,<2", "dateparser>=1.2,<2",
  "joblib>=1.4,<2", "tzdata>=2025.1", "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
nlplab = "nlplab.cli:main"

[tool.setuptools.packages.find]
include = ["nlplab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
