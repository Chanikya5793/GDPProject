[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "northwest-planner-copilot"
version = "0.1.0"
description = "Authenticated, encrypted planner RAG and proposal service"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43.0,<47",
  "fastapi>=0.115,<1",
  "firebase-admin>=6.6,<8",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-kms>=3.2,<4",
  "google-cloud-secret-manager>=2.21,<3",
  "google-genai>=1.30,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF"]
ignore = ["E501"]
